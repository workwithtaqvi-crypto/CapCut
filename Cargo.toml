[package]
name = "litecut"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight video editor - Phase 1: Home dashboard"
license = "MIT"

[dependencies]
# glow (OpenGL) backend: much lighter on RAM/VRAM than wgpu, ideal for 4GB / 1GB-GPU machines.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11"] }

[profile.release]
opt-level = "s"      # small + fast enough for UI work
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
