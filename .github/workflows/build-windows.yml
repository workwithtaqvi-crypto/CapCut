name: Build Windows portable exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release exe
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Collect exe
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/litecut.exe dist/litecut.exe
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: litecut-windows-portable
          path: dist/litecut.exe

      - name: Publish release with download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LiteCut build ${{ github.run_number }}
          body: "Portable Windows build (no installer). Download litecut.exe and double-click to run."
          files: dist/litecut.exe
          make_latest: true
